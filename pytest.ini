[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Per-module (not average) coverage is enforced in tests/conftest.py:
# every source module must reach at least 80% line coverage.
addopts = --cov=. --cov-report=term-missing

[coverage:run]
omit =
    tests/*
    .venv/*

[coverage:report]
show_missing = True
